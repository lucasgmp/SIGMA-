<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuraçoes</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #333; }

        /* Menu Lateral (O mesmo padrão das outras telas) */
        .sidebar { width: 250px; height: 100vh; background: #0f2a2e; color: white; position: fixed; display: flex; flex-direction: column; }
        .sidebar h2 { text-align: center; padding: 20px 0; margin: 0; border-bottom: 1px solid #1e4a50; }
        .sidebar a { display: block; padding: 15px 20px; color: #a4c8cc; text-decoration: none; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: #1e4a50; color: white; border-left: 4px solid #27ae60; }
        .sidebar .logout { margin-top: auto; background: #c0392b; color: white; border-left: none; }

        /* Conteúdo e Layout em Grid */
        .main-content { margin-left: 250px; padding: 30px; }
        .settings-grid { display: grid; grid-template-columns:  1fr; gap: 20px; margin-top: 20px; }

        /* Cartões de Configuração */
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }

        /* Formulários */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #7f8c8d; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        /* Botões */
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #219653; }
        .btn-danger { background: #e74c3c; margin-top: 10px; }
        .btn-danger:hover { background: #c0392b; }

        /* Checkboxes customizados estilo iPhone (Toggle) */
        .toggle-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px; }
        .toggle-container span { font-weight: bold; font-size: 14px; color: #2c3e50; }

        /* Mensagem de Sucesso */
        .toast { display: none; background: #27ae60; color: white; padding: 15px; text-align: center; border-radius: 4px; margin-bottom: 20px; font-weight: bold; }
    </style>
<body>
    <div class="main-content">
        <h1>Painel de configuraçoes</h1>
        <p>Gerencie suas preferências de usuário e sistema administrativo.</p>
        <div id="msgSucesso" class="toast">✅ Configurações salvas com sucesso!</div>
        <div class="settings-grid">
            <div class="card">
                <h3>👤 Dados do Operador</h3>
                <form onsubmit="salvarPerfil(event)">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" value="Inspetor Silva" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail Corporativo</label>
                        <input type="email" value="silva.inspetor@sigma.gov.br" required>
                    </div>
                    <div class="form-group">
                        <label>Nova Senha</label>
                        <input type="password" placeholder="Digite apenas se quiser alterar">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Nova Senha</label>
                        <input type="password" placeholder="Confirme a nova senha">
                    </div>
                    <button type="submit">Atualizar Perfil</button>
                </form>

            </div>
            <div>
                <div class="card" style="margin-bottom: 20px;">
                    <h3>🔔 Preferências de Alertas</h3>

                    <div class="toggle-container">
                        <span>Receber Alertas de Queda de Servidor (SMS)</span>
                        <input type="checkbox" checked>
                    </div>
                    <div class="toggle-container">
                        <span>Notificações de Novos Registros</span>
                        <input type="checkbox" checked>
                    </div>
                    <div class="toggle-container">
                        <span>Relatório de Desempenho Semanal (E-mail)</span>
                        <input type="checkbox">
                    </div>
                    <button onclick="salvarPreferencias()">Salvar Preferências</button>
            </div>
</div>
            <script>
                function salvarPerfil(event) {
            event.preventDefault(); // Impede a página de recarregar
            mostrarMensagemSucesso();
        }
        function salvarPreferencias() {
            mostrarMensagemSucesso();
        }
        function mostrarMensagemSucesso() {
            const toast = document.getElementById('msgSucesso');
            toast.style.display = 'block';

            // Oculta a mensagem verde após 3 segundos
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }</script>
</body>

</head>
</html>
